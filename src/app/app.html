<div class="app">
  <header>
    <h1>Gerador de Mapas</h1>
    <p>Masmorras e cavernas procedurais para RPG de mesa (1 quadrado = 5 pés).</p>
  </header>

  <app-dungeon-controls
    [(options)]="options"
    (generate)="generate()"
    (reroll)="reroll()"
  />

  <app-dungeon-map
    [map]="map()"
    [view]="options().view ?? 'dm'"
    [theme]="options().theme ?? 'stone'"
    [showGrid]="options().grid ?? true"
  />
</div>
